<!-- Files Tab - Modern & Compact -->
<section x-show="currentTab === 'files'" class="section-modern animate-fade-in">
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-6">
        <div>
            <h2 class="text-2xl font-bold bg-gradient-to-r from-gray-800 to-gray-600 bg-clip-text text-transparent mb-2">Hash Files</h2>
            <p class="text-gray-600">Upload and manage target hash files for cracking</p>
        </div>
        <button @click="openFileModal()" class="btn-primary">
            <i class="fas fa-upload mr-2"></i>Upload Hash File
        </button>
    </div>

    <div class="flex justify-end mb-4">
        <div class="relative">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
            <input type="text" class="input-modern py-1 pl-8" placeholder="Search files..."
                   @input="setFileTableSearch($event)">
        </div>
    </div>
    
    <!-- Loading Skeletons -->
    <div x-show="filesTableLoading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="card-modern p-4 animate-pulse">
            <div class="flex items-center space-x-3 mb-3">
                <div class="w-8 h-8 bg-gray-300 rounded-lg"></div>
                <div class="flex-1">
                    <div class="h-3 bg-gray-300 rounded mb-1"></div>
                    <div class="h-2 bg-gray-200 rounded"></div>
                </div>
            </div>
            <div class="space-y-2">
                <div class="h-2 bg-gray-200 rounded"></div>
                <div class="h-2 bg-gray-200 rounded w-3/4"></div>
            </div>
            <div class="mt-3 h-8 bg-gray-200 rounded"></div>
        </div>
        <div class="card-modern p-4 animate-pulse">
            <div class="flex items-center space-x-3 mb-3">
                <div class="w-8 h-8 bg-gray-300 rounded-lg"></div>
                <div class="flex-1">
                    <div class="h-3 bg-gray-300 rounded mb-1"></div>
                    <div class="h-2 bg-gray-200 rounded"></div>
                </div>
            </div>
            <div class="space-y-2">
                <div class="h-2 bg-gray-200 rounded"></div>
                <div class="h-2 bg-gray-200 rounded w-3/4"></div>
            </div>
            <div class="mt-3 h-8 bg-gray-200 rounded"></div>
        </div>
        <div class="card-modern p-4 animate-pulse">
            <div class="flex items-center space-x-3 mb-3">
                <div class="w-8 h-8 bg-gray-300 rounded-lg"></div>
                <div class="flex-1">
                    <div class="h-3 bg-gray-300 rounded mb-1"></div>
                    <div class="h-2 bg-gray-200 rounded"></div>
                </div>
            </div>
            <div class="space-y-2">
                <div class="h-2 bg-gray-200 rounded"></div>
                <div class="h-2 bg-gray-200 rounded w-3/4"></div>
            </div>
            <div class="mt-3 h-8 bg-gray-200 rounded"></div>
        </div>
    </div>
    
    <!-- Hash Files Grid -->
    <div x-show="!filesTableLoading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="file in hashFiles" :key="file.id">
            <div class="card-modern p-4 group hover:shadow-lg transition-all duration-200 overflow-hidden">
                <div class="flex items-start space-x-3 mb-3 min-w-0">
                    <div class="w-8 h-8 shrink-0 rounded-lg bg-gradient-to-br from-red-500 to-pink-600 flex items-center justify-center text-white">
                        <i class="fas fa-wifi text-xs"></i>
                    </div>
                    <div class="min-w-0 flex-1">
                        <h3 class="font-semibold text-gray-900 text-sm break-all leading-snug" x-text="file.orig_name || file.name">File Name</h3>
                        <p class="text-xs text-gray-500 mt-1" x-text="formatFileSize(file.size)">File Size</p>
                    </div>
                </div>
                
                <div class="space-y-2 mb-3 text-xs">
                    <div class="flex items-center text-gray-600">
                        <i class="fas fa-clock text-gray-400 mr-2 w-3"></i>
                        <span x-text="formatDate(file.created_at)">Upload Date</span>
                    </div>
                    <div class="flex items-center text-gray-600">
                        <i class="fas fa-info-circle text-gray-400 mr-2 w-3"></i>
                        <span x-text="file.type || 'Unknown type'">Hash Type</span>
                    </div>
                </div>
                
                <div class="flex space-x-2">
                    <button @click="downloadFile(file.id, file.orig_name || file.name)" 
                            class="btn-secondary flex-1 text-xs py-2 flex items-center justify-center space-x-1">
                        <i class="fas fa-download"></i>
                        <span>Download</span>
                    </button>
                    <button @click="deleteFile(file.id)" 
                            class="btn-danger text-xs py-2 px-3">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        </template>
        
        <!-- Empty State -->
        <div x-show="hashFiles.length === 0" class="col-span-full text-center py-12">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-gray-200 to-gray-300 flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-file-alt text-2xl text-gray-400"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-900 mb-2">No Hash Files Yet</h3>
            <p class="text-gray-500 mb-4">Upload your first hash file to start cracking</p>
            <button @click="openFileModal()" class="btn-primary">
                <i class="fas fa-upload mr-2"></i>Upload First Hash File
            </button>
        </div>
    </div>

    <div x-show="(fileTable.total||0) > (fileTable.pageSize||20)"
         class="flex items-center justify-end mt-4 text-sm">
        <div class="flex items-center gap-2 flex-wrap">
            <button class="px-3 py-1 rounded-md border text-gray-600 hover:bg-gray-50"
                    :class="(fileTable.page||1) === 1 ? 'opacity-50 cursor-not-allowed bg-gray-200' : ''"
                    :disabled="(fileTable.page||1) === 1"
                    @click="goPrevFilesPage()">
                <i class="fas fa-chevron-left"></i>
            </button>
            <template x-for="p in Math.max(1, Math.ceil((fileTable.total||0)/(fileTable.pageSize||20)))" :key="p">
                <button class="px-3 py-1 rounded-md border"
                        :class="(fileTable.page===p) ? 'bg-blue-50 border-blue-400 text-blue-600' : 'text-gray-700 hover:bg-gray-50'"
                        @click="goToFilesPage(p)" x-text="p"></button>
            </template>
            <button class="px-3 py-1 rounded-md border text-gray-600 hover:bg-gray-50"
                    :class="(() => { const page=fileTable.page||1; const size=parseInt(fileTable.pageSize||20); const total=fileTable.total||0; return page*size>=total ? 'opacity-50 cursor-not-allowed bg-gray-200' : '' })()"
                    :disabled="(() => { const page=fileTable.page||1; const size=parseInt(fileTable.pageSize||20); const total=fileTable.total||0; return page*size>=total })()"
                    @click="goNextFilesPage()">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</section>
